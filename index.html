<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赋能模拟器 · 职业选手设置库</title>
  <link rel="icon" type="image/png" href="assets/图标/源能战魂.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="demo-banner">数据整理自公开资料 · ★ 标记的选手设置已核实，其余为待核实占位 · 持续更新 · 纯信息查询工具，不读写游戏文件</div>

  <nav class="topnav">
    <div class="nav-logo">
      <span class="logo-mark"><img src="assets/图标/源能战魂.png" alt="赋能模拟器" title="源能战魂（Radiant）段位徽章"></span>
      <div class="nav-logo-text"><b>赋能模拟器</b><i>职业选手设置库</i></div>
    </div>
    <div class="nav-links">
      <a href="#top" class="active" data-view="players">首页</a>
      <a href="#browse" data-view="players">选手库</a>
      <a href="#browse" data-view="streamers">热门准星</a>
      <a href="#browse" data-view="common">常用准星</a>
      <a href="#browse" data-view="fun">娱乐准星</a>
    </div>
    <span class="nav-badge">网页原型 v0.2</span>
  </nav>

  <header class="hero" id="top">
    <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span>
    <span class="hero-pill">⚡ 无畏契约职业选手设置库</span>
    <h2 class="hero-title">赋能模拟器</h2>
    <p class="hero-sub">收录 2026 VCT 职业选手同款设置与准星代码<br>一键复制导入，秒级完成设置，打瓦更顺手</p>
    <div class="hero-cta">
      <button class="cta cta-red" data-scroll="#browse" type="button">🎯 浏览选手</button>
      <button class="cta cta-blue" data-tool type="button">🧪 灵敏度实验室</button>
      <button class="cta cta-dark" data-random type="button">🎲 随机一位</button>
    </div>
    <div class="hero-stats" id="hero-stats"></div>
    <button class="daily-pick" id="daily-pick" type="button"></button>
    <input id="search" class="hero-search" type="search" placeholder="搜索 选手ID / 战队 / 位置…">
    <span class="hero-scroll">↓</span>
  </header>

  <main id="browse">
  <nav class="filters">
    <select id="f-region"><option value="">全部赛区</option></select>
    <select id="f-team"><option value="">全部战队</option></select>
    <select id="f-role"><option value="">全部位置</option></select>
    <select id="f-tier"><option value="">灵敏度档位</option></select>
    <select id="f-color"><option value="">准星颜色</option></select>
    <button id="fav-toggle" class="fav-toggle" type="button">☆ 只看收藏</button>
    <button id="reset" class="reset" type="button">重置</button>
    <span id="count" class="count"></span>
    <span id="chips" class="chips" hidden></span>
  </nav>

  <main>
    <section id="grid" class="grid"></section>
    <p id="empty" class="empty" hidden>没有符合条件的选手，试试放宽筛选条件。</p>
  </main>
  </main>

  <footer class="footer" id="footer">
    赋能模拟器 · 网页原型 v0.2 · 纯信息查询工具，不读写游戏文件 · 收藏数据保存在本机浏览器
  </footer>

  <!-- 选手详情弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-mask" id="modal-mask"></div>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" type="button">✕ 关闭</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data/players.js"></script>
  <script src="data/streamers.js"></script>
  <script src="data/presets.js"></script>
  <script src="data/photos.js"></script>
  <script src="data/maps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
